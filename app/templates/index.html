<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>マネージャー支援 AI</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      width: 100%;
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      padding: 14px 24px;
      font-size: 18px;
      font-weight: 600;
      color: #1a1a1a;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    header .skill-badge {
      font-size: 13px;
      font-weight: 500;
      color: #4f46e5;
      background: #eef2ff;
      padding: 3px 10px;
      border-radius: 20px;
    }

    #menu-btn {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      color: #1a1a1a;
      flex-shrink: 0;
      margin-right: 4px;
    }

    #menu-btn svg { width: 22px; height: 22px; }

    #sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.3);
      z-index: 10;
    }

    #sidebar-overlay.visible { display: block; }

    #main {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* ── Skill sidebar ── */
    #skill-panel {
      width: 240px;
      flex-shrink: 0;
      background: #fff;
      border-right: 1px solid #e0e0e0;
      overflow-y: auto;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    @media (max-width: 640px) {
      #menu-btn { display: flex; }

      #skill-panel {
        position: fixed;
        top: 0;
        left: -260px;
        width: 260px;
        height: 100dvh;
        z-index: 20;
        border-right: 1px solid #e0e0e0;
        transition: left 0.25s ease;
        padding-top: 20px;
      }

      #skill-panel.is-open { left: 0; }
    }

    .skill-category h3 {
      font-size: 11px;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 0 8px;
      margin-bottom: 6px;
    }

    .skill-item {
      display: block;
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      border-radius: 8px;
      padding: 8px 10px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .skill-item:hover { background: #f3f4f6; }

    .skill-item.active {
      background: #eef2ff;
    }

    .skill-item .skill-name {
      font-size: 13px;
      font-weight: 600;
      color: #1a1a1a;
    }

    .skill-item.active .skill-name { color: #4f46e5; }

    .skill-note {
      font-size: 11px;
      color: #aaa;
      line-height: 1.6;
      padding: 8px 10px;
      border-top: 1px solid #f0f0f0;
      margin-top: auto;
    }

    .skill-item .skill-desc {
      font-size: 11px;
      color: #888;
      margin-top: 2px;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* ── Chat area ── */
    #chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      align-items: center;
    }

    #chat-container {
      flex: 1;
      width: 100%;
      max-width: 800px;
      overflow-y: auto;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      display: flex;
      gap: 12px;
      max-width: 100%;
    }

    .message.user { flex-direction: row-reverse; }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .message.user .avatar  { background: #4f46e5; color: #fff; }
    .message.assistant .avatar { background: #10a37f; color: #fff; }

    .bubble {
      padding: 12px 16px;
      border-radius: 16px;
      line-height: 1.6;
      font-size: 15px;
      white-space: pre-wrap;
      word-break: break-word;
      max-width: calc(100% - 60px);
    }

    .message.user .bubble {
      background: #4f46e5;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .message.assistant .bubble {
      background: #fff;
      color: #1a1a1a;
      border-bottom-left-radius: 4px;
      border: 1px solid #e0e0e0;
    }

    .typing::after {
      content: "▋";
      animation: blink 0.7s step-start infinite;
    }

    @keyframes blink { 50% { opacity: 0; } }

    #error-banner {
      display: none;
      background: #fee2e2;
      color: #b91c1c;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 14px;
      margin: 0 16px 8px;
      max-width: 800px;
      width: calc(100% - 32px);
    }

    #input-area {
      width: 100%;
      max-width: 800px;
      padding: 12px 16px 20px;
    }

    #input-wrapper {
      display: flex;
      gap: 10px;
      background: #fff;
      border: 1px solid #d0d0d0;
      border-radius: 16px;
      padding: 10px 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      align-items: flex-end;
    }

    #user-input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 15px;
      resize: none;
      max-height: 160px;
      line-height: 1.5;
      font-family: inherit;
      background: transparent;
    }

    #send-btn {
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 50%;
      background: #4f46e5;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s;
    }

    #send-btn:disabled { background: #c0bdf0; cursor: default; }
    #send-btn:not(:disabled):hover { background: #4338ca; }
    #send-btn svg { width: 18px; height: 18px; }
  </style>
</head>
<body>
  <header>
    <button id="menu-btn" title="スキルメニュー" aria-label="スキルメニューを開く">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="3" y1="6" x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
    <span>マネージャー支援 AI</span>
    <span id="active-skill-badge" class="skill-badge"></span>
  </header>

  <div id="sidebar-overlay"></div>

  <div id="main">
    <aside id="skill-panel">
      <!-- populated by JS -->
      <div class="skill-note">
        スキルを選ぶと、そのプロンプトが適用されます。<br>
        ※ orchestrator は適切なスキルへの案内のみ行います。スキルの自動切り替えは行われません。
      </div>
    </aside>

    <div id="chat-area">
      <div id="chat-container"></div>
      <div id="error-banner"></div>
      <div id="input-area">
        <div id="input-wrapper">
          <textarea id="user-input" rows="1" placeholder="メッセージを入力…"></textarea>
          <button id="send-btn" title="送信">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"/>
              <polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const chatContainer = document.getElementById("chat-container");
    const userInput = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");
    const errorBanner = document.getElementById("error-banner");
    const skillPanel = document.getElementById("skill-panel");
    const activeBadge = document.getElementById("active-skill-badge");
    const menuBtn = document.getElementById("menu-btn");
    const sidebarOverlay = document.getElementById("sidebar-overlay");

    let history = [];
    let activeSkill = "manager-orchestrator";

    // ── Sidebar toggle (mobile) ──────────────────────────────
    function openSidebar() {
      skillPanel.classList.add("is-open");
      sidebarOverlay.classList.add("visible");
    }

    function closeSidebar() {
      skillPanel.classList.remove("is-open");
      sidebarOverlay.classList.remove("visible");
    }

    menuBtn.addEventListener("click", () => {
      skillPanel.classList.contains("is-open") ? closeSidebar() : openSidebar();
    });

    sidebarOverlay.addEventListener("click", closeSidebar);

    // ── Skill panel ──────────────────────────────────────────
    async function loadSkills() {
      const res = await fetch("/api/skills");
      const skills = await res.json();

      const byCategory = {};
      for (const s of skills) {
        if (!byCategory[s.category]) byCategory[s.category] = { label: s.categoryLabel, items: [] };
        byCategory[s.category].items.push(s);
      }

      for (const [, group] of Object.entries(byCategory)) {
        const section = document.createElement("div");
        section.className = "skill-category";

        const h3 = document.createElement("h3");
        h3.textContent = group.label;
        section.appendChild(h3);

        for (const skill of group.items) {
          const btn = document.createElement("button");
          btn.className = "skill-item" + (skill.id === activeSkill ? " active" : "");
          btn.dataset.skillId = skill.id;
          btn.dataset.skillName = skill.name;

          const nameEl = document.createElement("div");
          nameEl.className = "skill-name";
          nameEl.textContent = skill.name;

          const descEl = document.createElement("div");
          descEl.className = "skill-desc";
          descEl.textContent = skill.description;

          btn.appendChild(nameEl);
          btn.appendChild(descEl);
          btn.addEventListener("click", () => { selectSkill(skill.id, skill.name); closeSidebar(); });
          section.appendChild(btn);
        }

        skillPanel.insertBefore(section, skillPanel.querySelector(".skill-note"));
      }

      // Set initial badge
      const initial = skills.find(s => s.id === activeSkill);
      if (initial) activeBadge.textContent = initial.name;
    }

    function selectSkill(skillId, skillName) {
      if (skillId === activeSkill) return;
      activeSkill = skillId;
      activeBadge.textContent = skillName;

      // Update active state
      document.querySelectorAll(".skill-item").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.skillId === skillId);
      });

      // Reset conversation
      history = [];
      chatContainer.innerHTML = "";
    }

    // ── Chat ─────────────────────────────────────────────────
    userInput.addEventListener("input", () => {
      userInput.style.height = "auto";
      userInput.style.height = Math.min(userInput.scrollHeight, 160) + "px";
    });

    userInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        sendMessage();
        setTimeout(() => {
          userInput.value = "";
          userInput.style.height = "auto";
        }, 0);
      }
    });

    sendBtn.addEventListener("click", sendMessage);

    function addMessage(role, text, typing = false) {
      const wrap = document.createElement("div");
      wrap.className = `message ${role}`;

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = role === "user" ? "You" : "AI";

      const bubble = document.createElement("div");
      bubble.className = "bubble" + (typing ? " typing" : "");
      bubble.textContent = text;

      wrap.appendChild(avatar);
      wrap.appendChild(bubble);
      chatContainer.appendChild(wrap);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return bubble;
    }

    function showError(msg) {
      errorBanner.textContent = msg;
      errorBanner.style.display = "block";
      setTimeout(() => { errorBanner.style.display = "none"; }, 5000);
    }

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      errorBanner.style.display = "none";
      userInput.value = "";
      userInput.style.height = "auto";
      sendBtn.disabled = true;

      addMessage("user", text);
      history.push({ role: "user", content: text });

      const aiBubble = addMessage("assistant", "", true);

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: history, skill: activeSkill }),
        });

        if (!res.ok) {
          const errText = await res.text();
          throw new Error(errText || `HTTP ${res.status}`);
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let reply = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          const chunk = decoder.decode(value, { stream: true });
          reply += chunk;
          aiBubble.classList.remove("typing");
          aiBubble.textContent = reply;
          chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        aiBubble.classList.remove("typing");
        history.push({ role: "assistant", content: reply });
      } catch (err) {
        aiBubble.classList.remove("typing");
        aiBubble.textContent = "エラーが発生しました。";
        showError(err.message);
      } finally {
        sendBtn.disabled = false;
        userInput.focus();
      }
    }

    loadSkills();
  </script>
</body>
</html>
